# User Settings — performance optimized
# Applied: July 2026

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

render {
    # Enable direct scanout for reduced latency when fullscreen
    direct_scanout = 1
    # Enable explicit sync for NVIDIA (disabled globally via env var, 
    # but the compositor render path benefits from this)
    # explicit_sync = 0 is handled by AQ_MGPU_NO_EXPLICIT
}

misc {
    # Disable VRR for now (may flicker with NVIDIA)
    vrr = 0
    # Reduce ANR threshold back to more responsive default
    anr_missed_pings = 5
}

cursor {
    # Enable hardware cursors on AMD iGPU (faster, less CPU usage)
    no_hardware_cursors = 0
}

# Optimize blur for performance
decoration {
    blur {
        # Reduce blur passes from 3 to 2 (significant perf gain, minimal visual loss)
        passes = 2
        # Keep size reasonable
        size = 4
    }
}
